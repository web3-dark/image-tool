<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="How lossy and lossless compression work">
  <title>Lossy vs lossless compression</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel-title { font: 700 18px -apple-system, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif; }
      .panel-desc { font: 400 13px -apple-system, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif; fill: #475569; }
      .legend { font: 500 12px -apple-system, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif; fill: #475569; }
      .badge { font: 700 11px -apple-system, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif; }
      .border { fill: none; stroke: #E2E8F0; stroke-width: 1.5; }
      .arrow { stroke: #94A3B8; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="grad-orig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="33%" stop-color="#3B82F6"/>
      <stop offset="66%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="800" height="360"/>


  <g transform="translate(40,30)">
    <rect class="border" x="0" y="0" width="350" height="300" rx="12" fill="#F8FAFC"/>
    <rect x="14" y="14" width="60" height="22" rx="11" fill="#34C759"/>
    <text class="badge" x="44" y="29" text-anchor="middle" fill="#FFFFFF">Lossless</text>
    <text class="panel-title" x="84" y="30" fill="#0F172A">PNG / lossless WebP</text>


    <text class="legend" x="14" y="68">Original pixels</text>
    <rect x="14" y="78" width="140" height="100" fill="url(#grad-orig)" rx="6"/>


    <path class="arrow" d="M158 128 L196 128"/>
    <text class="legend" x="177" y="120" text-anchor="middle">Compress</text>


    <text class="legend" x="200" y="68">Decoded</text>
    <rect x="200" y="78" width="140" height="100" fill="url(#grad-orig)" rx="6"/>

    <text class="panel-desc" x="14" y="210">
      <tspan x="14" dy="0">Every pixel matches the original.</tspan>
      <tspan x="14" dy="22">Repeated patterns are packed efficiently,</tspan>
      <tspan x="14" dy="22">without discarding any information.</tspan>
      <tspan x="14" dy="22" fill="#0F172A" font-weight="600">→ Good for icons, screenshots and line art</tspan>
    </text>
  </g>


  <g transform="translate(410,30)">
    <rect class="border" x="0" y="0" width="350" height="300" rx="12" fill="#F8FAFC"/>
    <rect x="14" y="14" width="60" height="22" rx="11" fill="#FF9500"/>
    <text class="badge" x="44" y="29" text-anchor="middle" fill="#FFFFFF">Lossy</text>
    <text class="panel-title" x="84" y="30" fill="#0F172A">JPG / WebP / AVIF</text>


    <text class="legend" x="14" y="68">Original pixels</text>
    <rect x="14" y="78" width="140" height="100" fill="url(#grad-orig)" rx="6"/>


    <path class="arrow" d="M158 128 L196 128"/>
    <text class="legend" x="177" y="120" text-anchor="middle">Compress</text>


    <text class="legend" x="200" y="68">Decoded (simplified)</text>
    <g transform="translate(200,78)">
      <rect width="46" height="50" fill="#1E78D9"/>
      <rect x="46" width="48" height="50" fill="#4F86E7"/>
      <rect x="94" width="46" height="50" fill="#7B7BEB"/>
      <rect y="50" width="46" height="50" fill="#5089D9"/>
      <rect x="46" y="50" width="48" height="50" fill="#7080E1"/>
      <rect x="94" y="50" width="46" height="50" fill="#9587EA"/>
      <rect class="border" width="140" height="100" rx="6"/>
    </g>

    <text class="panel-desc" x="14" y="210">
      <tspan x="14" dy="0">Discards details that are hard to notice.</tspan>
      <tspan x="14" dy="22">Much smaller files with little visible</tspan>
      <tspan x="14" dy="22">difference at suitable quality settings.</tspan>
      <tspan x="14" dy="22" fill="#0F172A" font-weight="600">→ Good for photos and complex images</tspan>
    </text>
  </g>
</svg>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 强制 360/搜狗/QQ 浏览器使用 Webkit 内核，避免 IE 兼容模式 -->
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

    <!-- 全局信息（每页 SEO meta 由 React Head 注入，避免 SSG 重复标签） -->
    <meta name="author" content="picthin" />
    <meta name="robots" content="index, follow" />

    <!-- 站长平台验证 -->
    <meta name="google-site-verification" content="d1CmbnA0yDDOaiYwfhe7hgUVt7YQASxmwdQizXoN6uM" />
    <!-- 百度站长：https://ziyuan.baidu.com/site/siteadd -->
    <meta name="baidu-site-verification" content="codeva-R0laznOjV3" />
    <!-- Bing 站长：https://www.bing.com/webmasters -->
    <!-- <meta name="msvalidate.01" content="YOUR_BING_CODE" /> -->

    <meta property="og:site_name" content="picthin" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- PWA / iOS Web App -->
    <meta name="theme-color" content="#0A84FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="图片压缩" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- 图标 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Analytics（取消注释并替换 data-website-id 以启用 Umami 统计）
      Umami 是开源、无 Cookie、符合 GDPR 的访问统计工具：https://umami.is
    -->
    <!--
    <script defer src="https://YOUR_UMAMI_HOST/script.js" data-website-id="YOUR_WEBSITE_ID"></script>
    -->

  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      noscript 内容供不执行 JS 的搜索引擎（如百度）抓取页面语义。
      对普通用户不可见。
    -->
    <noscript>
      <div style="max-width:800px;margin:40px auto;padding:0 20px;font-family:sans-serif;color:#333">
        <h1>图片压缩工具 - 免费在线压缩 JPEG PNG WebP</h1>
        <p>本工具支持 JPEG、PNG、WebP、AVIF、GIF 图片的在线压缩与格式转换，全程在您的设备本地完成，图片不会上传到任何服务器，保护您的隐私安全。</p>
        <h2>主要功能</h2>
        <ul>
          <li>支持 JPEG / PNG / WebP / AVIF / GIF 多种格式</li>
          <li>批量压缩，同时处理多张图片</li>
          <li>自定义压缩质量（10%–100%）</li>
          <li>格式互转：JPEG 转 WebP、PNG 转 JPEG 等</li>
          <li>完全免费，无需注册，无需上传</li>
          <li>支持手机、平板、电脑全平台</li>
        </ul>
        <p>请启用 JavaScript 以使用本工具。</p>
      </div>
    </noscript>
  </body>
</html>
